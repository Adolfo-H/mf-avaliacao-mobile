name: MF Mobile - TypeScript, lint e Expo

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mf-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias exatamente pelo package-lock
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Expo Doctor SDK 58
        run: npx expo-doctor

      - name: ESLint
        run: npm run lint

      # Alertas upstream ainda existentes no Expo: visiveis, mas nao sao
      # confundidos com testes funcionais. Nunca executar audit fix --force.
      - name: Auditoria npm em producao (diagnostico)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
